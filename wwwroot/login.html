<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatClaw Music · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<!-- 主题初始化 -->
<script>
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem('catclaw_prefs') || '{}');
    var theme = prefs.theme || 'dark';
    var resolved = theme;
    if (theme === 'system') {
      resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', resolved);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<style>
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-0); }
/* 密码字段用 text-security 替代 type="password"，支持中文输入法 */
.pwd-field { -webkit-text-security: disc; -moz-text-security: disc; text-security: disc; }
.auth-loading { text-align: center; color: var(--text-2); padding: 24px; }
.auth-msg { text-align: center; margin-top: 14px; font-size: 13px; color: var(--danger); min-height: 20px; }
.auth-msg.ok { color: var(--success); }
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-logo-icon { font-size: 48px; margin-bottom: 10px; }
.auth-hint { text-align: center; margin-top: 18px; font-size: 12px; color: var(--text-3); line-height: 1.7; }
.auth-hint code { background: var(--bg-3); padding: 2px 8px; border-radius: 6px; color: var(--accent); border: 1px solid var(--border-strong); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="modal" style="max-width:400px;width:calc(100vw - 40px);animation:modalIn 0.3s ease;">
    <div class="auth-logo">
        <div class="auth-logo-icon">🐱</div>
        <h1 style="font-size:24px;font-weight:800;letter-spacing:-0.02em;">Cat<span style="background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Claw</span> Music</h1>
        <div class="sub" id="subtitle" style="color:var(--text-2);font-size:13px;margin-top:6px;">正在检查…</div>
    </div>

    <!-- 登录表单 -->
    <div id="loginForm" style="display:none;">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" class="form-control" id="loginUser" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="text" class="form-control pwd-field" id="loginPass" placeholder="输入密码" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" style="width:100%;padding:12px;font-size:15px;" onclick="doLogin()">登 录</button>
        <div class="auth-msg" id="loginMsg"></div>
        <div class="auth-hint">忘记密码？请在服务端控制台执行 <code>claw reset</code> 重置账号</div>
    </div>

    <!-- 注册表单（首次启动） -->
    <div id="registerForm" style="display:none;">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" class="form-control" id="regUser" placeholder="admin" autocomplete="off">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="text" class="form-control pwd-field" id="regPass" placeholder="至少 4 个字符" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="text" class="form-control pwd-field" id="regPass2" placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" style="width:100%;padding:12px;font-size:15px;" onclick="doRegister()">创 建 管 理 员</button>
        <div class="auth-msg" id="regMsg"></div>
        <div class="auth-hint">首次启动，请创建管理员账号以开始使用</div>
    </div>

    <div class="auth-loading" id="loading">正在检查系统状态…</div>
</div>

<script>
async function init() {
    try {
        const r = await fetch('/api/auth/status');
        const j = await r.json();
        document.getElementById('loading').style.display = 'none';

        if (j.configured) {
            document.getElementById('subtitle').textContent = '请登录以继续';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loginUser').focus();
        } else {
            document.getElementById('subtitle').textContent = '首次使用，请创建管理员账号';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('regUser').focus();
        }
    } catch {
        document.getElementById('loading').textContent = '无法连接服务器，请刷新重试';
    }
}
init();

// ── 登录 ──
async function doLogin() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMsg');
    msg.textContent = ''; msg.className = 'auth-msg';
    if (!u || !p) { msg.textContent = '请输入用户名和密码'; return; }
    try {
        const res = await fetch('/api/auth/login', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username:u, password:p })
        });
        if (res.ok) {
            msg.className = 'auth-msg ok';
            msg.textContent = '登录成功，跳转中…';
            setTimeout(() => location.href = '/', 500);
        } else {
            const j = await res.json();
            msg.textContent = j.message || '登录失败';
        }
    } catch {
        msg.textContent = '网络错误，请重试';
    }
}

// ── 注册（首次） ──
async function doRegister() {
    const u = document.getElementById('regUser').value.trim();
    const p = document.getElementById('regPass').value.trim();
    const p2 = document.getElementById('regPass2').value.trim();
    const msg = document.getElementById('regMsg');
    msg.textContent = ''; msg.className = 'auth-msg';

    if (!u) { msg.textContent = '请输入用户名'; return; }
    if (u.length < 2) { msg.textContent = '用户名至少 2 个字符'; return; }
    if (!p) { msg.textContent = '请输入密码'; return; }
    if (p.length < 4) { msg.textContent = '密码至少 4 个字符'; return; }
    if (p !== p2) { msg.textContent = '两次密码不一致'; return; }

    try {
        const res = await fetch('/api/auth/register', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username:u, password:p })
        });
        const j = await res.json();
        if (res.ok) {
            msg.className = 'auth-msg ok';
            msg.textContent = '注册成功，跳转中…';
            setTimeout(() => location.href = '/', 500);
        } else {
            msg.textContent = j.message || '注册失败';
            if (j.message && j.message.includes('已注册')) {
                setTimeout(() => location.reload(), 1500);
            }
        }
    } catch {
        msg.textContent = '网络错误，请重试';
    }
}

// Enter 键提交
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('regPass2').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
